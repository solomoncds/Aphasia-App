<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" fill="white"/>
  
      <!-- Person beckoning -->
      <circle cx="160" cy="100" r="30" fill="#FFB74D"/>
      <line x1="160" y1="130" x2="160" y2="220" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="160" y1="220" x2="130" y2="280" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="160" y1="220" x2="190" y2="280" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <!-- Beckoning arm -->
      <line x1="160" y1="160" x2="210" y2="130" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="210" y1="130" x2="220" y2="110" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <!-- Other arm -->
      <line x1="160" y1="160" x2="110" y2="190" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <!-- Motion arrows -->
      <path d="M250,160 L210,160 L220,150 M210,160 L220,170" stroke="#4CAF50" stroke-width="4" fill="none"/>
      <path d="M260,180 L220,180 L230,170 M220,180 L230,190" stroke="#4CAF50" stroke-width="4" fill="none"/>
    
</svg>