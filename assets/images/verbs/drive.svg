<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" fill="white"/>
  
      <!-- Car with person -->
      <rect x="60" y="150" width="200" height="80" rx="15" fill="#F44336"/>
      <rect x="100" y="120" width="120" height="50" rx="10" fill="#64B5F6"/>
      <!-- Windshield -->
      <rect x="110" y="130" width="45" height="30" rx="5" fill="#E3F2FD"/>
      <rect x="165" y="130" width="45" height="30" rx="5" fill="#E3F2FD"/>
      <!-- Driver head -->
      <circle cx="190" cy="135" r="12" fill="#FFB74D"/>
      <!-- Wheels -->
      <circle cx="110" cy="235" r="22" fill="#333"/>
      <circle cx="110" cy="235" r="10" fill="#666"/>
      <circle cx="210" cy="235" r="22" fill="#333"/>
      <circle cx="210" cy="235" r="10" fill="#666"/>
      <!-- Headlights -->
      <rect x="255" y="170" width="15" height="15" rx="3" fill="#FFEB3B"/>
    
</svg>