<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" fill="white"/>
  
      <!-- Person pulling a rope -->
      <circle cx="180" cy="100" r="25" fill="#FFB74D"/>
      <!-- Leaning body -->
      <line x1="180" y1="125" x2="200" y2="210" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="200" y1="210" x2="220" y2="280" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="200" y1="210" x2="180" y2="280" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <!-- Arms pulling back -->
      <line x1="180" y1="155" x2="130" y2="140" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="130" y1="140" x2="100" y2="130" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <!-- Rope -->
      <line x1="100" y1="130" x2="50" y2="145" stroke="#795548" stroke-width="5" stroke-linecap="round"/>
      <line x1="50" y1="145" x2="30" y2="140" stroke="#795548" stroke-width="5" stroke-linecap="round"/>
      <!-- Arrow showing pull direction -->
      <path d="M80,100 L50,100 M60,90 L50,100 L60,110" stroke="#795548" stroke-width="4" fill="none"/>
    
</svg>