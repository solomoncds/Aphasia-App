<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" fill="white"/>
  
      <!-- Person looking -->
      <circle cx="140" cy="100" r="30" fill="#FFB74D"/>
      <line x1="140" y1="130" x2="140" y2="220" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="140" y1="220" x2="110" y2="280" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="140" y1="220" x2="170" y2="280" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="140" y1="160" x2="100" y2="190" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <!-- Hand shielding eyes -->
      <line x1="140" y1="160" x2="180" y2="100" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <!-- Eye/vision lines -->
      <line x1="170" y1="95" x2="260" y2="80" stroke="#2196F3" stroke-width="3" stroke-dasharray="8,4"/>
      <line x1="170" y1="100" x2="260" y2="100" stroke="#2196F3" stroke-width="3" stroke-dasharray="8,4"/>
      <line x1="170" y1="105" x2="260" y2="120" stroke="#2196F3" stroke-width="3" stroke-dasharray="8,4"/>
      <!-- Eye symbol -->
      <ellipse cx="265" cy="100" rx="20" ry="15" fill="none" stroke="#2196F3" stroke-width="3"/>
      <circle cx="265" cy="100" r="6" fill="#2196F3"/>
    
</svg>