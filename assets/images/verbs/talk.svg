<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" fill="white"/>
  
      <!-- Person talking -->
      <circle cx="150" cy="100" r="30" fill="#FFB74D"/>
      <line x1="150" y1="130" x2="150" y2="220" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="150" y1="220" x2="120" y2="280" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="150" y1="220" x2="180" y2="280" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="150" y1="160" x2="110" y2="190" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <line x1="150" y1="160" x2="190" y2="190" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <!-- Mouth open -->
      <ellipse cx="150" cy="112" rx="8" ry="5" fill="#E57373"/>
      <!-- Speech bubble -->
      <rect x="200" y="60" width="80" height="50" rx="10" fill="none" stroke="#9C27B0" stroke-width="3"/>
      <polygon points="200,90 190,100 210,90" fill="none" stroke="#9C27B0" stroke-width="3"/>
      <line x1="215" y1="75" x2="265" y2="75" stroke="#9C27B0" stroke-width="3"/>
      <line x1="215" y1="85" x2="255" y2="85" stroke="#9C27B0" stroke-width="3"/>
      <line x1="215" y1="95" x2="245" y2="95" stroke="#9C27B0" stroke-width="3"/>
    
</svg>